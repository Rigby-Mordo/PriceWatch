name: PriceWatch Daily Check

on:
  schedule:
    - cron: '0 9 * * *' # Her gün Türkiye saatiyle 12:00 civarı çalışır
  workflow_dispatch: # Manuel çalıştırmak için butonu aktif tutar

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    # GitHub'ın işlemi yarıda kesmemesi için süreyi artırıyoruz
    timeout-minutes: 30 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        # Yeni eklediğimiz stealth paketleri için npm install şart
        run: npm install

      - name: Run PriceWatch Scraper
        # Hata olsa bile günlüğün (log) tamamlanması için node index.js çalıştırılır
        run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
